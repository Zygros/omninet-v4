[tool.poetry]
name = "omninet-v4"
version = "3.0.0-UNITY"
description = "OmniNet v4 — research and engineering platform for distributed AI orchestration and knowledge systems."
authors = ["Zygros"]
packages = [{ include = "omninet" }]  # autofix 2026-11-10: poetry could not find a package named omninet_v4

[tool.poetry.dependencies]
python = ">=3.8"  # autofix 2026-11-10: poetry requires a python constraint
requests = "^2.26.0"
numpy = "^1.21.0"
aiohttp = "^3.8.1"
# asyncio = "^3.4.3"  # autofix 2026-11-10: asyncio is Python stdlib; the PyPI 'asyncio' 3.4.3 backport breaks installs on Python 3
pandas = "^1.3.5"
cryptography = "^35.0.0"
pycryptodome = "^3.14.0"
python-dotenv = "^0.19.0"
pyyaml = "^6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
