name: OmniNet secure-cell verification

on:
  push:
    branches:
      - main
      - sovereign-execution/secure-cell-verification
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secure-cell-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run focused secure-cell tests
        run: python -m pytest tests/test_secure_cell.py -q
