name: OmniNet secure-cell verification

on:
  push:
    branches:
      - main
      - sovereign-execution/secure-cell-verification
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secure-cell-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install "cryptography>=35.0.0,<36.0.0" pytest
      - name: Run focused secure-cell and replay tests
        run: python -m pytest tests/test_secure_cell.py tests/test_replay_guard.py tests/test_package_version.py -q
